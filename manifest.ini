name = "abaAcademy"
summary = "Arab Blind Academy - أكاديمية الكفيف العربي"
description = "أكاديمية تعليمية متكاملة داخل NVDA للمستخدم الكفيف الناطق بالعربية: اللغة العربية (نحو وإملاء إلى مستوى الآجرومية)، الإنجليزية، الفرنسية، برايل، الحاسوب ومهارات NVDA وويندوز وأوفيس، الرياضيات، العلوم، التاريخ، الجغرافيا، والثقافة العامة. أكثر من سبعمئة درس بمسار تدرّجي حقيقي، ومحرّك دروس معياري (JSON)، ومولّد أسئلة إجرائي بلا حدود يولّد أمثلة لا تنتهي، وتكرار متباعد، وإحصائيات، وتحديات كتابة. لا يحتاج إلى تثبيت أي مكتبة خارجية: قاعدة البيانات مضمّنة داخل الإضافة (SQLite عند توفّره، وإلا محرّك بايثون خالص). الواجهة بالعربية دائماً مهما كانت لغة NVDA. اضغط Escape للإغلاق، وShift+Escape للخروج الكامل. يمكن إعادة فتح النافذة في الجلسة نفسها بعد إغلاقها."
author = "Riad Assoum"
version = "1.0"
